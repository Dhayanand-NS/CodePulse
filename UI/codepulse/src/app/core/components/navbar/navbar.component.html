<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Codepulse</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <ng-container *ngIf="user != undefined && user?.roles?.includes('Writer')">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Admin
          </a>
          <ul class="dropdown-menu">  
            <li><a class="dropdown-item" [routerLink]="['/admin/categories']">Categories</a></li>
            <li class="dropdown-divider"></li>
            <li><a class="dropdown-item" [routerLink]="['/admin/blogpost']">BlogPost</a></li>
          </ul>
        </li>
        </ng-container>
      </ul>

      <div class="d-flex">
        <ng-container *ngIf="user === undefined; else notfound">
        <!-- show login button -->
        <a [routerLink]="['/login']" class="btn btn-primary">Login</a>
        </ng-container>
      </div>
      <ng-template #notfound>
        <!-- show Logout button -->
        <div class="d-flex align-items-center">
          <span>{{user?.email}}</span>
          <button class="btn btn-primary" (click)="OnLogout()">Logout</button>
        </div>
      </ng-template>
    </div>

  </div>
</nav>

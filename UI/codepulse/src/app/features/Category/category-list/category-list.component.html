<div class="container">
    <h1 class="mt-3">Category List</h1>
    
    <div class="d-flex justify-content-between mt-3">
        <form #form="ngForm" (ngSubmit)="OnFormSubmit()">
            <div class="d-flex flex-row justify-content-between ml-3">
                <label class="form-label">Name</label>
                <input class="form-control" [(ngModel)]="modal.name" type="text" name="CategoryName" id="CategoryName">
                <label class="form-label">URL</label>
                <input class="form-control" [(ngModel)]="modal.urlHandle" type="text" name="categoryUrlHandle"
                    id="categoryUrlHandle">
                <button type="submit" class="btn btn-light">Search</button>
            </div>
        </form>
        <a href="" class="btn btn-primary" routerLink="/admin/categories/addcategory"> Add Category</a>
    </div>

    <ng-container *ngIf="categories$ | async as categories" >
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name
                        <span>
                            <span><button type="button" class="btn btn-light" (click)="ToSort('name','asc')"><i class="bi bi-arrow-up"></i></button></span>
                            <span><button type="button" class="btn btn-light" (click)="ToSort('name','desc')"><i class="bi bi-arrow-down"></i></button></span>
                        </span>
                    </th>
                    <th>URL Handle
                       <span>
                            <span><button type="button" class="btn btn-light" (click)="ToSort('urlHandle','asc')"><i class="bi bi-arrow-up"></i></button></span>
                            <span><button type="button" class="btn btn-light" (click)="ToSort('urlHandle','desc')"><i class="bi bi-arrow-down"></i></button></span>
                        </span>
                    </th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let category of categories">
                    <td>{{category.id}}</td> 
                    <td>{{category.name}}</td>
                    <td>{{category.urlHandle}}</td>
                    <td>
                        <a class="btn btn-light" [routerLink]="['/admin/categories',category.id]">Edit</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <nav aria-label="Page navigation example">
  <ul class="pagination">
    <li class="page-item"><a class="page-link" (click)="getDataByPage(currentPage-1)">Previous</a></li>
    <li  *ngFor="let item of list;let index = index" class="page-item"><a (click)="getDataByPage(index+1)" class="page-link">{{index+1}}</a></li>
    <li class="page-item"><a class="page-link" (click)="getDataByPage(currentPage+1)">Next</a></li>
  </ul>
</nav>
    </ng-container>
</div>
